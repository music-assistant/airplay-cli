name: Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_API_VERSION: "2026-03-10"

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  immutable-settings:
    name: Verify immutable release settings
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create immutable-settings token
        id: immutable-settings-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read

      - name: Validate immutable release settings
        env:
          APP_SLUG: ${{ steps.immutable-settings-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.immutable-settings-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ "$APP_SLUG" != "musicassistant-bot" ]]; then
            echo "::error::Immutable-settings token belongs to $APP_SLUG, expected musicassistant-bot."
            exit 1
          fi

          if ! immutable_enabled="$(
            gh api \
              --method GET \
              --header "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq '.enabled'
          )"; then
            echo "::error::The GitHub App needs repository administration read access to verify immutable releases."
            exit 1
          fi
          if [[ "$immutable_enabled" != "true" ]]; then
            echo "::error::Enable release immutability under Settings > General > Releases before publishing."
            exit 1
          fi

  prepare-release:
    name: Prepare release
    needs: immutable-settings
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_release="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 100 \
              --json tagName,publishedAt \
              --jq 'map(select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | sort_by(.publishedAt) | last | .tagName // ""'
          )"

          if [[ -z "$latest_release" ]]; then
            release_tag="v0.1.0"
            commit_count="$(git rev-list --count HEAD)"
          else
            if ! git merge-base --is-ancestor "$latest_release" HEAD; then
              echo "::error::Latest release $latest_release is not an ancestor of HEAD"
              exit 1
            fi

            version="${latest_release#v}"
            IFS=. read -r major minor patch <<< "$version"
            release_tag="v${major}.${minor}.$((10#$patch + 1))"
            commit_count="$(git rev-list --count "${latest_release}..HEAD")"
          fi

          echo "latest_release=$latest_release" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if (( commit_count == 0 )); then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No commits found since ${latest_release:-the repository was created}; skipping release."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Preparing $release_tag from $commit_count new commit(s)."

      - name: Create release tag
        if: steps.version.outputs.should_release == 'true'
        env:
          LATEST_RELEASE: ${{ steps.version.outputs.latest_release }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if ! git merge-base --is-ancestor "$tag_sha" "$head_sha"; then
              echo "::error::$RELEASE_TAG points to $tag_sha, which is not on the current HEAD history"
              exit 1
            fi
            if [[ -n "$LATEST_RELEASE" ]]; then
              if ! git merge-base --is-ancestor "$LATEST_RELEASE" "$tag_sha"; then
                echo "::error::$RELEASE_TAG points before or outside latest release $LATEST_RELEASE"
                exit 1
              fi
              if [[ "$(git rev-list --count "${LATEST_RELEASE}..${tag_sha}")" -eq 0 ]]; then
                echo "::error::$RELEASE_TAG contains no commits after $LATEST_RELEASE"
                exit 1
              fi
            fi
            if [[ "$tag_sha" == "$head_sha" ]]; then
              echo "Reusing $RELEASE_TAG at HEAD."
            else
              echo "Reusing orphaned $RELEASE_TAG at $tag_sha; later commits remain for the next release."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          # GITHUB_TOKEN tag pushes do not start a competing v* workflow run.
          git push origin "refs/tags/$RELEASE_TAG"

  release:
    name: Build and release
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    secrets:
      MUSIC_ASSISTANT_BOT_PRIVATE_KEY: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
